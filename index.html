<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1528">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ascension</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#0E1528; --ink-2:#141D35; --ink-3:#1B2643; --line:#2B3756;
  --text:#EFE6D4; --muted:#A9AFBF; --gold:#E3B562; --gold-soft:#F3D9A4;
  --ember:#F2913D; --pine:#5E8C76; --alert:#E58A78;
  --serif:"Fraunces", Georgia, "Times New Roman", serif;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --tabs:68px;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{padding-top:env(safe-area-inset-top,0px)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{max-width:480px;margin:0 auto;height:100%;position:relative}
#view{position:absolute;inset:0 0 calc(var(--tabs) + env(safe-area-inset-bottom,0px)) 0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;letter-spacing:-0.005em;font-variation-settings:"SOFT" 50}
h1{font-size:34px;line-height:1.05}
h2{font-size:26px;line-height:1.15}
h3{font-size:21px;line-height:1.2}
p{margin:0}
.muted{color:var(--muted)}
.page{padding:28px 20px 40px;display:flex;flex-direction:column;gap:18px}

/* tabs */
.tabs{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tabs) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--ink);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11.5px;font-weight:500;min-height:48px}
.tabs button[aria-current="page"]{color:var(--gold)}
.tabs svg{width:22px;height:22px}

/* buttons */
.btn{min-height:46px;border-radius:12px;border:0;background:var(--gold);color:#1B1408;font-weight:600;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:500}
.btn.line{background:transparent;border:1px solid var(--gold);color:var(--gold-soft)}
.btn.small{min-height:40px;padding:0 14px;font-size:14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* map */
.map{position:relative}
.map svg{display:block;width:100%;height:auto}
.map-head{position:absolute;left:0;right:0;top:0;padding:22px 20px 0;display:flex;flex-direction:column;gap:6px;text-shadow:0 1px 12px rgba(5,8,22,.9);pointer-events:none}
.map-head .cap{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--gold-soft)}
.map-head .meta{font-size:13px;color:#D9DCE6}
.chip{cursor:pointer}
.chip rect{transition:stroke .2s}
.chip:hover rect,.chip:focus rect{stroke:var(--gold-soft)}
.chip:focus{outline:none}
.chip:focus-visible rect{stroke:#fff;stroke-width:2}

/* action bar */
.actionbar{position:sticky;bottom:10px;margin:0 12px;z-index:5;background:rgba(18,24,44,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--gold);border-radius:16px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.actionbar.alert{border-color:var(--alert)}
.actionbar .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.actionbar strong{font-family:var(--serif);font-weight:500;font-size:17px}
.actionbar span{font-size:13px;color:var(--muted)}

/* cards */
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card.today{border-color:var(--gold)}
.trail{font-size:13px;color:var(--gold-soft);font-weight:500}
.why{font-family:var(--serif);font-style:italic;color:#D8CDB6;font-size:15px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.safety{font-size:13px;color:var(--alert);border-left:2px solid var(--alert);padding-left:10px}
.progress{font-size:13.5px;color:var(--muted)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line)}
.dot.ok{background:var(--gold);border-color:var(--gold)}
.dot.ko{border-color:var(--alert);background:rgba(229,138,120,.25)}
.dot.now{border-color:var(--gold-soft)}
.note{font-size:13.5px;color:#D8CDB6;background:rgba(227,181,98,.08);border:1px solid rgba(227,181,98,.3);border-radius:12px;padding:10px 12px}
.fond{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--ink-3)}
.choice{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--ink-3);text-align:left;width:100%}
.choice[aria-pressed="true"]{border-color:var(--gold);background:rgba(227,181,98,.1)}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);flex:none}
.choice[aria-pressed="true"] .radio{border-color:var(--gold);background:radial-gradient(var(--gold) 45%,transparent 50%)}
input[type=number],input[type=time],textarea{background:var(--ink-3);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
textarea{min-height:120px;resize:vertical;font-size:14px}
.err{color:var(--alert);font-size:14px}
.list{display:flex;flex-direction:column;gap:10px}
.entry{border-left:2px solid var(--line);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:3px}
.entry.feu{border-color:var(--ember)}
.entry .when{font-size:12.5px;color:var(--muted)}
.feel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.feel button{min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--ink-3);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;gap:2px}
.feel button b{font-family:var(--serif);font-size:20px;font-weight:500}
.feel button[aria-pressed="true"]{border-color:var(--gold);background:rgba(227,181,98,.12);color:var(--gold-soft)}
.ep{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.ep .m{width:22px;height:22px;border-radius:50%;flex:none;margin-top:2px;border:1.5px solid var(--muted)}
.ep .m.validee{background:var(--gold);border-color:var(--gold)}
.ep .m.active{border:2.5px solid var(--ember);box-shadow:0 0 0 4px rgba(242,145,61,.2)}
.ep .m.verrouillee{border-style:dashed}

/* onboarding */
.hero{position:relative;min-height:62vh;display:flex;align-items:flex-end;background:url(montagne.jpg) center 28%/cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,21,40,0) 30%,rgba(14,21,40,.85) 75%,var(--ink) 100%)}
.hero .in{position:relative;z-index:1;padding:0 20px 8px;display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:40px;line-height:1.02}
.step{display:flex;gap:14px;align-items:flex-start}
.step .n{font-family:var(--serif);font-size:24px;color:var(--gold);line-height:1;width:22px;flex:none}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(5,8,20,.6)}
.panel{position:relative;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:var(--ink-2);border-radius:24px 24px 0 0;border-top:1px solid var(--line);padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .28s cubic-bezier(.2,.7,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.x{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--ink-3);flex:none;display:flex;align-items:center;justify-content:center}
.scene{border-radius:16px;overflow:hidden;border:1px solid rgba(227,181,98,.35)}
.scene img{display:block;width:100%;height:150px;object-fit:cover}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;background:var(--ink-3);border:1px solid var(--gold);color:var(--text);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast[hidden]{display:none}
@media (prefers-reduced-motion: reduce){.panel{animation:none}.pulse{display:none}}

/* guide intégré */
#chat{position:fixed;inset:0;z-index:25;background:var(--ink);display:flex;flex-direction:column;max-width:480px;margin:0 auto}
#chat[hidden]{display:none}
.chat-head{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;border-bottom:1px solid var(--line)}
.chat-head img{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none;border:1px solid rgba(227,181,98,.4)}
.chat-head .t{flex:1;min-width:0}
.chat-head h3{font-size:19px}
.msgs{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.msg{white-space:pre-wrap;overflow-wrap:anywhere}
.msg.guide{font-family:var(--serif);font-size:16.5px;line-height:1.6;max-width:94%}
.msg.me{align-self:flex-end;background:var(--ink-3);border:1px solid var(--line);border-radius:16px 16px 4px 16px;padding:10px 14px;max-width:85%}
.typing{display:flex;gap:5px;padding:6px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.4;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:1}}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.composer textarea{min-height:48px;max-height:140px;flex:1;font-size:15px}
.composer .btn{width:52px;padding:0}
.result{border:1px solid var(--gold);border-radius:16px;padding:16px;background:rgba(227,181,98,.08);display:flex;flex-direction:column;gap:10px}
select{background:var(--ink-3);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;color:var(--text)}
input[type=password]{background:var(--ink-3);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
@media (prefers-reduced-motion: reduce){.typing i{animation:none;opacity:.8}}
</style>
</head>
<body>
<div id="app">
  <main id="view" tabindex="-1"></main>
  <nav class="tabs" id="tabs" aria-label="Navigation"></nav>
</div>
<div class="sheet" id="sheet" hidden>
  <div class="scrim" data-a="close"></div>
  <div class="panel" role="dialog" aria-modal="true" id="panel"></div>
</div>
<div id="chat" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
/* ---------- textes du guide ---------- */
const CORE = `Tu es le guide de montagne d'une app de progression appelée Ascension. Chaque compétence est un massif : la forêt (niveau 1), les pentes (niveau 2), la falaise (niveau 3), puis le sommet. Les branches sont des sentiers, faits d'épreuves. Une montagne se grimpe pas à pas.

TON RÔLE
- Ton chaleureux, direct, adulte. Une seule question à la fois, jamais de questionnaire en liste.
- Tu accompagnes une personne, pas seulement des performances : creuse le ressenti, la motivation, les doutes, les freins, le contexte de vie. Reflète ce que la personne dit et demande-lui ce qu'elle en pense ; n'impose jamais d'interprétation psychologique.
- Tu proposes, tu expliques, la personne tranche.

FABRICATION DES ÉPREUVES
- Une action concrète et mesurable, faisable dans les contraintes de la personne.
- 20 minutes par jour et par sentier au maximum : c'est un plafond, pas un objectif. Compose une vraie mini-séance cohérente plutôt que de remplir du temps.
- Les prérequis avant la performance. Une marche à la fois : chaque épreuve un peu plus dure que la précédente, jamais un bond. Si une épreuve a été vécue comme très dure, la suivante consolide au lieu d'augmenter.
- Un « pourquoi » en une phrase qui relie l'épreuve à son sentier et au cap. Une consigne de sécurité quand c'est utile.
- Tu peux puiser dans des exercices mentaux pertinents : respiration, cohérence cardiaque, visualisation, journal, pleine conscience, recadrage, exposition progressive, etc.
- Types d'épreuve :
  frequence = faire X fois sur N jours (cible = X, fenetre_jours = N)
  retrait = tenir sans quelque chose X jours sur N (cible = X, fenetre_jours = N)
  seuil = atteindre une mesure (cible = la valeur, unite = l'unité, fenetre_jours = délai)
  unique = faire une fois (cible = 1)
  savoir = comprendre ou savoir faire ; tu le vérifies au prochain feu de camp (cible = 1)
- 3 sentiers actifs au maximum.

GARDE-FOUS
- Objectif trop loin du niveau : découpe-le ; le reste deviendra un massif suivant.
- Signal de santé (douleur, blessure, condition) : adapte et recommande un professionnel. Aucun diagnostic médical, aucun travail thérapeutique profond. Si tu perçois une vraie détresse, dis-le avec bienveillance et oriente vers un professionnel.
- Compétence dangereuse ou illégale : refuse poliment.

FORMAT D'UNE ÉPREUVE (ÉPREUVE)
{"titre":"","type":"frequence","critere":"","cible":5,"unite":"","fenetre_jours":7,"contenu":["étape 1","étape 2"],"difficulte":1,"pourquoi":"","securite":""}`;

const DIAG = CORE + `

MISSION : LE DIAGNOSTIC DE DÉPART
1. Ouvre par : « Une montagne se grimpe pas à pas. Pas de raccourci, pas de sprint. » Puis présente-toi en deux phrases.
2. Conversation de 8 à 12 questions, une à la fois : la compétence visée et son pourquoi ; le niveau ressenti ; le temps disponible par jour, le matériel, le lieu, la vie de famille ; blessures, douleurs ou santé ; motivation, doutes, freins ; le seuil de suffisance (ce qui suffirait vraiment).
3. Placement : propose 1 à 3 tests concrets et sans risque pour mesurer le niveau réel. On peut arrêter à tout moment ; on note ce qui a été tenu et le ressenti, jamais « réussi » ou « raté ». La personne revient avec ses résultats sous 48 h : interroge son ressenti avant de continuer.
4. Construis la montagne : 1 ou 2 sentiers de départ, les épreuves de la FORÊT seulement (3 à 6 par sentier selon la personne), et un titre d'intention pour les pentes et la falaise.
5. Présente un résumé lisible. La personne valide ou demande UN ajustement.
6. Termine UNIQUEMENT par ce bloc JSON, sans aucun texte après :
{"cap":"","massif":"Massif …","duree_zone_jours":21,"intentions":{"pentes":"","falaise":""},"sentiers":[{"nom":"","pourquoi":"","seuil_suffisance":"","epreuves":[ÉPREUVE, ...]}]}`;

const ZONES = ["la forêt","les pentes","la falaise","le sommet"];
const ZONE_T = ["La forêt","Les pentes","La falaise","Le sommet"];
const CAMP_T = ["Camp de base","Feu de camp N1","Feu de camp N2","Feu de camp N3","Sommet"];
const FEEL = ["Très dur","Dur","Correct","Bien","Facile"];

/* ---------- utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diff = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const fmt = s => parse(s).toLocaleDateString("fr-FR",{day:"numeric",month:"long"});
const uid = () => Math.random().toString(36).slice(2,9);

let mem = null;
const KEY = "ascension-v1";
function load(){ try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }catch(e){ return mem; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ mem = S; } }

let S = load();
let UI = { tab:"montagne", sheet:null };

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,3200); }

async function copy(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(_){} ta.remove(); return ok;
  }
}
function download(name, content, type){
  const blob=new Blob([content],{type}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
}
function extractJSON(txt){
  const t = String(txt||"").replace(/```(json)?/gi,"");
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if(a<0||b<=a) throw new Error("Aucun bloc entre accolades { } trouvé. Colle la toute dernière réponse du guide, en entier.");
  try{ return JSON.parse(t.slice(a,b+1)); }
  catch(e){ throw new Error("Le bloc est incomplet ou mal formé. Demande au guide : « Redonne-moi uniquement le bloc JSON final. »"); }
}

/* ---------- modèle ---------- */
const TYPES = {frequence:"frequence","fréquence":"frequence",retrait:"retrait",seuil:"seuil",unique:"unique",savoir:"savoir"};
const DEF = {frequence:[5,7],retrait:[7,7],seuil:[1,14],unique:[1,7],savoir:[1,14]};
function normEp(e, zone){
  const type = TYPES[String(e.type||"").toLowerCase().trim()] || "frequence";
  const cible = Number(e.cible) > 0 ? Number(e.cible) : DEF[type][0];
  let fen = Number(e.fenetre_jours) > 0 ? Number(e.fenetre_jours) : DEF[type][1];
  if((type==="frequence"||type==="retrait") && fen < cible) fen = cible;
  return { id:uid(), zone, titre:String(e.titre||"Épreuve"), type, critere:String(e.critere||""), cible, unite:String(e.unite||""),
    fen, contenu:Array.isArray(e.contenu)?e.contenu.map(String):[], difficulte:Number(e.difficulte)||1,
    pourquoi:String(e.pourquoi||""), securite:String(e.securite||""), etat:"verrouillee", debut:null, relance:0, log:{} };
}
function newTrail(t, zone){
  return { id:uid(), nom:String(t.nom||"Sentier"), pourquoi:String(t.pourquoi||""), seuil:String(t.seuil_suffisance||""),
    statut:"actif", parent:t.parent||"", bivouac:-1, conseil:"", fond:[], fondLog:{},
    epreuves:(t.epreuves||[]).map(e=>normEp(e,zone)) };
}
const active = () => S.sentiers.filter(s=>s.statut==="actif");
const zoneEps = (s,z=S.zone) => s.epreuves.filter(e=>e.zone===z);
const arrived = s => { const e=zoneEps(s); return e.length>0 && e.every(x=>x.etat==="validee"); };
function activateNext(s){
  if(zoneEps(s).some(e=>e.etat==="active")) return;
  const n = zoneEps(s).find(e=>e.etat!=="validee");
  if(n){ n.etat="active"; n.debut=today(); n.relance=n.relance||0; }
}
function winEnd(e){ return addDays(e.debut, e.fen-1); }
function prog(e){
  const end=winEnd(e); let count=0, best=null;
  for(const [d,v] of Object.entries(e.log)){
    if(d<e.debut||d>end) continue;
    if(e.type==="seuil"){ const n=Number(v); if(!isNaN(n)) best = best===null?n:Math.max(best,n); }
    else if(v===1) count++;
  }
  const reached = e.type==="seuil" ? (best!==null && best>=e.cible) : (e.type==="frequence"||e.type==="retrait") ? count>=e.cible : false;
  return {count,best,reached,end};
}
function touch(){ S.last=today(); }

function buildFromDiag(j){
  if(!j || !Array.isArray(j.sentiers) || !j.sentiers.length) throw new Error("Le bloc ne contient aucun sentier. Demande au guide le bloc JSON final complet.");
  const prev = S && S.massif ? (S.archives||[]).concat([{massif:S.massif.nom, cap:S.massif.cap, fin:today()}]) : (S?.archives||[]);
  S = { v:1, massif:{ cap:String(j.cap||""), nom:String(j.massif||"Mon massif"), duree:Number(j.duree_zone_jours)||21,
        intentions:{pentes:j.intentions?.pentes||"", falaise:j.intentions?.falaise||""}, debut:today() },
        zone:0, zoneDebut:today(), last:today(), sentiers:j.sentiers.slice(0,3).map(t=>newTrail(t,0)),
        journal:[{date:today(), type:"diagnostic", texte:`Montagne construite : ${j.massif||""}. Cap : ${j.cap||""}.`}],
        demain:null, halte:null, sommet:false, archives:prev };
  S.sentiers.forEach(activateNext);
}

/* ---------- règles automatiques ---------- */
function checkRules(){
  if(!S || !S.massif || S.sommet) return;
  const t=today();
  for(const s of active()){
    for(const e of zoneEps(s)){
      if(e.etat!=="active" || !["frequence","retrait","seuil"].includes(e.type)) continue;
      if(t>winEnd(e) && !prog(e).reached){
        if(e.relance<1){ e.relance=1; e.debut=t; e.log={}; S.journal.push({date:t,type:"relance",sentier:s.nom,epreuve:e.titre,texte:"Fenêtre terminée : épreuve relancée une fois, sans jugement."}); toast(`« ${e.titre} » est relancée, sans jugement.`); }
        else if(!S.halte){ S.halte={raison:`L'épreuve « ${e.titre} » n'a pas abouti deux fois de suite.`, date:t}; }
      }
    }
  }
  if(!S.halte && S.zone<3 && diff(S.zoneDebut,t) > Math.round(S.massif.duree*1.5)) S.halte={raison:`La zone dure depuis ${diff(S.zoneDebut,t)} jours, bien au-delà des ${S.massif.duree} prévus.`, date:t};
  if(!S.halte && diff(S.last||t,t) >= 3) S.halte={raison:`Aucune coche depuis ${diff(S.last,t)} jours.`, date:t};
  save();
}
function campState(){
  if(!S || S.sommet || S.zone>2) return null;
  const a=active(); if(!a.length) return null;
  const done=a.filter(arrived);
  if(done.length===a.length) return {kind:"feu"};
  const fresh=done.filter(s=>s.bivouac!==S.zone);
  if(fresh.length) return {kind:"bivouac", arrived:fresh, pending:a.filter(s=>!arrived(s))};
  return null;
}

const findTrail = n => S.sentiers.find(s=>s.nom.trim().toLowerCase()===String(n||"").trim().toLowerCase());

function applyFeu(j){
  const t=today();
  if(S.zone===2){
    if(!j.bilan) throw new Error("Le bloc ne contient pas de bilan. Demande au guide le bloc JSON final.");
    (j.entretien||[]).forEach(f=>{ const s=findTrail(f.sentier); if(s) s.fond=[{titre:String(f.titre||"Entretien"),contenu:(f.contenu||[]).map(String)}]; });
    S.zone=3; S.sommet=true; S.prochain=String(j.prochain_massif||"");
    S.journal.push({date:t,type:"sommet",texte:j.bilan}); touch(); return;
  }
  if(!Array.isArray(j.sentiers)) throw new Error("Le bloc ne contient pas de sentiers. Demande au guide le bloc JSON final.");
  const nz=S.zone+1;
  for(const r of j.sentiers){
    const d=String(r.decision||"continuer").toLowerCase();
    let s=findTrail(r.nom);
    if(!s){ s=newTrail({...r, epreuves:[]}, nz); S.sentiers.push(s); }
    if(r.pourquoi) s.pourquoi=String(r.pourquoi);
    if(r.seuil_suffisance) s.seuil=String(r.seuil_suffisance);
    if(d.startsWith("dorm")) s.statut="dormance";
    else if(d.startsWith("accompl")){ s.statut="accompli"; s.fond=(r.fond||[]).map(f=>({titre:String(f.titre||"Entretien"),contenu:(f.contenu||[]).map(String)})); }
    else { s.statut="actif"; s.epreuves.push(...(r.epreuves||[]).map(e=>normEp(e,nz))); }
  }
  for(const s of S.sentiers){ if(s.statut==="actif" && !zoneEps(s,nz).length) s.statut="dormance"; }
  if(active().length>3) active().slice(3).forEach(s=>s.statut="dormance");
  S.zone=nz; S.zoneDebut=t; S.halte=null;
  if(Number(j.duree_zone_jours)>0) S.massif.duree=Number(j.duree_zone_jours);
  if(j.intentions?.falaise) S.massif.intentions.falaise=String(j.intentions.falaise);
  S.sentiers.forEach(s=>{ s.conseil=""; if(s.statut==="actif"){ s.fond=[]; activateNext(s); } });
  S.journal.push({date:t,type:"feu",texte:j.bilan||"Feu de camp passé.", voie:j.voie||""}); touch();
}
function applyBivouac(j){
  (j.fond||[]).forEach(f=>{ const s=findTrail(f.sentier); if(s) s.fond.push({titre:String(f.titre||"Travail de fond"),contenu:(f.contenu||[]).map(String)}); });
  (j.aide||[]).forEach(a=>{ const s=findTrail(a.sentier); if(s) s.conseil=String(a.conseil||""); });
  active().filter(arrived).forEach(s=>s.bivouac=S.zone);
  S.journal.push({date:today(),type:"bivouac",texte:j.bilan||"Bivouac passé."}); touch();
}
function applyHalte(j){
  (j.ajustements||[]).forEach(a=>{ const s=findTrail(a.sentier); if(!s) return;
    s.epreuves = s.epreuves.filter(e=>!(e.zone===S.zone && e.etat!=="validee"));
    s.epreuves.push(...(a.epreuves||[]).map(e=>normEp(e,S.zone))); activateNext(s); });
  if(Number(j.duree_zone_jours)>0) S.massif.duree=Number(j.duree_zone_jours);
  S.journal.push({date:today(),type:"halte",texte:j.bilan||"Halte passée."}); S.halte=null; touch();
}

const P = {F1:[196,675], F2:[190,541], F3:[183,411], DOOR:[179,320], FLAG:[138,190], TENTS:[309,768]};
const SEG = [[P.F1,P.F2],[P.F2,P.F3],[P.F3,P.DOOR]];
const SPREAD=[45,105,45];
const q=(a,c,b,t)=>[(1-t)**2*a[0]+2*(1-t)*t*c[0]+t*t*b[0],(1-t)**2*a[1]+2*(1-t)*t*c[1]+t*t*b[1]];
function splitQ(a,c,b,t){ const m=q(a,c,b,t); return [[a,[a[0]+(c[0]-a[0])*t,a[1]+(c[1]-a[1])*t],m],[m,[c[0]+(b[0]-c[0])*t,c[1]+(b[1]-c[1])*t],b]]; }
const qd=([a,c,b])=>`M${a[0].toFixed(1)} ${a[1].toFixed(1)} Q${c[0].toFixed(1)} ${c[1].toFixed(1)} ${b[0].toFixed(1)} ${b[1].toFixed(1)}`;
function med([x,y],st){

  if(st==="active") return `<circle class="pulse" cx="${x}" cy="${y}" r="10" fill="none" stroke="#FFC870" stroke-width="2"><animate attributeName="r" values="10;20" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="${x}" cy="${y}" r="10.5" fill="#17161E" stroke="#FFC870" stroke-width="2.4"/><circle cx="${x}" cy="${y}" r="3.8" fill="#FFC870"/>`;
  if(st==="next") return `<circle cx="${x}" cy="${y}" r="8.5" fill="#17161E" fill-opacity=".9" stroke="#E3B562" stroke-width="1.4" stroke-dasharray="2.5 2"/>`;
  return `<circle cx="${x}" cy="${y}" r="8.5" fill="#121219" fill-opacity=".88" stroke="#9C845A" stroke-width="1.4"/><rect x="${x-3.2}" y="${y-.6}" width="6.4" height="4.8" rx="1" fill="#C9AE78"/><path d="M${x-2} ${y-.6} v-1.8 a2 2 0 0 1 4 0 v1.8" fill="none" stroke="#C9AE78" stroke-width="1.2"/>`;
}
const lab=(x,y,t,o={})=>`<text x="${x}" y="${y}" text-anchor="${o.a||"start"}" font-family="${o.serif?"Fraunces, Georgia, serif":"Instrument Sans, system-ui, sans-serif"}" font-size="${o.s||11}" font-weight="${o.w||600}" ${o.i?'font-style="italic"':""} fill="${o.f||"#fff"}" stroke="#0B0E1A" stroke-width="3.2" stroke-linejoin="round" paint-order="stroke">${esc(t)}</text>`;
function chip(id,x,y,title,sub,state){
  const icon = state==="done" ? `<circle cx="${x+20}" cy="${y+21}" r="11" fill="#E3B562"/><path d="M${x+15.5} ${y+21.3} l3 3 l5.5 -5.5" fill="none" stroke="#1B1408" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`

<rect x="${x}" y="${y}" width="128" height="42" rx="12" fill="rgba(10,12,24,.72)" stroke="${state==="now"?"#E3B562":"rgba(227,181,98,.45)"}" stroke-width="${state==="now"?1.6:1}"/>${icon}

function mapSVG(){
  let paths="", meds="", labels="";
  const Z=S.zone;
  for(let z=0;z<3;z++){
    const [a,b]=SEG[z]; const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    const trails=S.sentiers.filter(s=>zoneEps(s,z).length>0);
    if(z>Z || !trails.length){
      paths+=`<path d="M${a[0]} ${a[1]} L${b[0]} ${b[1]}" stroke="#DCE6FF" stroke-width="1.4" stroke-dasharray="3 5" opacity=".45" fill="none"/>`;
      meds+=med(mid,"lock"); continue;
    }
    const n=trails.length, offs = n===1?[.35]:n===2?[-1,1]:[-1,0,1];
    trails.forEach((s,i)=>{
      const c=[mid[0]+offs[i]*SPREAD[z], mid[1]]; const eps=zoneEps(s,z); const k=eps.length;
      const lastDone = eps.reduce((m,e,j)=>e.etat==="validee"?j:m,-1);
      const tDone = lastDone<0?0 : (lastDone===k-1?1:(lastDone+1)/(k+1));
      if(tDone>0){ const [d]=splitQ(a,c,b,tDone); paths+=`<path d="${qd(d)}" stroke="#FFE2A8" stroke-width="6" opacity=".55" filter="url(#gl)" fill="none"/><path d="${qd(d)}" stroke="#FFF6E2" stroke-width="2" fill="none"/>`; }
      if(tDone<1){ const [,r]=splitQ(a,c,b,tDone||0.0001); paths+=`<path d="${qd(r)}" stroke="#FFF6E2" stroke-width="1.8" stroke-dasharray="4 5" opacity=".8" fill="none"/>`; }
      let nextShown=false;
      eps.forEach((e,j)=>{ const p=q(a,c,b,(j+1)/(k+1)); let st=e.etat;
        if(st==="verrouillee" && !nextShown && z===Z){ st="next"; nextShown=true; } else if(st==="verrouillee") st="lock";
        if(st==="active") nextShown=true; meds+=med(p.map(v=>+v.toFixed(1)),st); });
      if(z===Z){ const p=q(a,c,b,.15); const side=offs[i]<0?-1:1; labels+=lab((p[0]+side*14).toFixed(1), (p[1]+4).toFixed(1), s.nom, {a:side<0?"end":"start", s:11.5, serif:true, i:true, w:500, f:"#F3D9A4"}); }
    });
  }
  const sum=`<path d="M179 320 C205 287 200 262 175 237 C158 219 146 205 138 192" stroke="${S.sommet?"#FFF6E2":"#DCE6FF"}" stroke-width="${S.sommet?2:1.4}" stroke-dasharray="${S.sommet?"0":"3 5"}" opacity="${S.sommet?.9:.45}" fill="none"/>`;
  const camps=[P.F2,P.F3,P.DOOR]; let rings=`<circle cx="${P.F1[0]}" cy="${P.F1[1]}" r="13" fill="none" stroke="#E3B562" stroke-width="1.6"/>`;
  camps.forEach((p,i)=>{
    if(i<Z) rings+=`<circle cx="${p[0]}" cy="${p[1]}" r="13" fill="none" stroke="#E3B562" stroke-width="1.6"/>`;
    else if(i===Z && !S.sommet) rings+=`<circle class="pulse" cx="${p[0]}" cy="${p[1]}" r="15" fill="none" stroke="#FFC870" stroke-width="2"><animate attributeName="r" values="14;30" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="${p[0]}" cy="${p[1]}" r="14" fill="none" stroke="#FFC870" stroke-width="2"/>`;
  });
  const left = Math.max(0, S.massif.duree - diff(S.zoneDebut,today()));
  const campLab = [lab(214,682,"Camp de base",{serif:true,w:500,s:12})];
  [[P.F2,"N1"],[P.F3,"N2"],[P.DOOR,"N3"]].forEach(([p,n],i)=>{
    const txt = i<Z ? `Feu ${n}, passé` : i===Z && !S.sommet ? `Feu ${n}, ${left?`dans ${left} j`:"à atteindre"}` : `Feu ${n}`;
    campLab.push(lab(p[0]+20, p[1]+4, txt, {s:11, f: i===Z && !S.sommet ? "#FFC870" : "#E4E6EE"}));
  });
  campLab.push(lab(160,200, S.sommet?"Sommet atteint":"Sommet",{serif:true,w:500,s:13,f:S.sommet?"#FFC870":"#fff"}));
  const st=z=> z<Z||S.sommet ? ["Passée","done"] : z===Z ? ["En cours","now"] : ["À venir","lock"];
  const chips = chip("base",214,700,"Camp de base","Ton diagnostic","done")
    + chip("0",16,560,"La forêt",st(0)[0],st(0)[1]) + chip("1",256,470,"Les pentes",st(1)[0],st(1)[1])
    + chip("2",236,345,"La falaise",st(2)[0],st(2)[1]) + chip("3",16,250,"Le sommet",S.sommet?"Atteint":"À venir",S.sommet?"done":"lock");
  return `<svg viewBox="0 0 390 867" role="img" aria-label="Carte de ta montagne">
<defs><filter id="gl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.6"/></filter></defs>
<image href="montagne.jpg" x="0" y="0" width="390" height="867" preserveAspectRatio="xMidYMid slice"/>
<g stroke-linecap="round" stroke-linejoin="round">${paths}${sum}</g>${rings}${meds}${labels}${campLab.join("")}${chips}</svg>`;
}

const KEYK="ascension-key", CHATK="ascension-chat";
const MODELS=[["claude-sonnet-5-5","Claude Sonnet 5.5, recommandé"],["claude-haiku-5-5","Claude Haiku 5.5, plus économique"]];
let memKey=null, memChat=null;
function getKey(){ try{ return JSON.parse(localStorage.getItem(KEYK)||"null"); }catch(e){ return memKey; } }
function setKey(v){ try{ v?localStorage.setItem(KEYK,JSON.stringify(v)):localStorage.removeItem(KEYK); }catch(e){ memKey=v; } }
function getChat(){ try{ return JSON.parse(localStorage.getItem(CHATK)||"null"); }catch(e){ return memChat; } }
function setChat(v){ try{ v?localStorage.setItem(CHATK,JSON.stringify(v)):localStorage.removeItem(CHATK); }catch(e){ memChat=v; } }
let C=getChat(); let draft="";
const OPEN={diag:"Bonjour, je suis prêt à commencer mon diagnostic.",feu:"Je viens d’arriver au feu de camp.",bivouac:"Je fais une pause au bivouac.",halte:"Je fais une halte."};
const CTITLE={diag:"Le diagnostic",feu:"Le feu de camp",bivouac:"Le bivouac",halte:"La halte"};
function appRules(){ return `

CADRE DE L'APP
- Tu parles dans l'application Ascension, lue sur un téléphone : réponses courtes (2 à 6 phrases), sauf le résumé final.
- Nous sommes le ${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}.
- L'app lit automatiquement ton bloc JSON final et l'applique à la montagne : donne-le en entier, dans un seul message, seulement quand la personne a validé.`; }
function sceneFor(kind){ return kind==="diag"?0:Math.min((S?.zone??0)+1,4); }
function startChat(kind){
  if(C && C.kind===kind){ openChat(); return; }
  if(C && C.kind!==kind && !confirm("Une autre conversation avec le guide est en cours. La remplacer ?")) return;
  let sys;
  if(kind==="diag") sys=DIAG;
  else if(kind==="feu") sys=promptFeu();
  else if(kind==="bivouac"){ const cs=campState(); if(cs?.kind!=="bivouac") return; sys=promptBivouac(cs); }
  else if(kind==="halte"){ if(!S.halte) return; sys=promptHalte(); }
  C={kind, system:sys+appRules(), msgs:[{role:"user",content:OPEN[kind],hidden:true}], started:today()};
  setChat(C); closeSheet(); openChat(); send();
}
function openChat(){ $("#chat").hidden=false; renderChat(); }
function closeChat(){ $("#chat").hidden=true; render(); }
function detect(kind,text){
  if(!text || !text.includes("{")) return null;
  let j; try{ j=extractJSON(text); }catch(e){ return null; }
  if(kind==="diag") return Array.isArray(j.sentiers)&&j.sentiers.length ? j : null;
  if(kind==="feu") return (S&&S.zone===2) ? (j.bilan?j:null) : (Array.isArray(j.sentiers)?j:null);
  if(kind==="bivouac") return (j.fond||j.aide||j.bilan!==undefined)?j:null;
  if(kind==="halte") return (j.ajustements||j.bilan!==undefined)?j:null;
  return null;
}
function visible(text){
  const f=text.search(/```/); const b=text.indexOf("{");
  const cut = f>=0 ? f : b; return cut>=0 ? text.slice(0,cut).trim() : text.trim();
}
async function callGuide(messages, system, maxTokens){
  const k=getKey(); if(!k?.key) throw new Error("Aucune clé enregistrée. Ajoute-la dans l’onglet Moi.");
  let r;
  try{
    r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":k.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:k.model||MODELS[0][0], max_tokens:maxTokens||4000, system, messages})});
  }catch(e){ throw new Error("Pas de connexion au guide. Vérifie ton réseau puis réessaie."); }
  if(r.status===401) throw new Error("La clé est refusée. Vérifie-la dans l’onglet Moi.");
  if(r.status===429) throw new Error("Le guide est très sollicité. Réessaie dans une minute.");
  if(r.status===400){ let m=""; try{ m=(await r.json())?.error?.message||""; }catch(_){} throw new Error("Requête refusée par le guide. "+m); }
  if(!r.ok) throw new Error(`Le guide ne répond pas (erreur ${r.status}). Réessaie dans un instant.`);
  const d=await r.json(); return (d.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("\n");
}
async function send(){
  if(!C || UI.busy) return;
  UI.busy=true; renderChat();
  try{
    const msgs=C.msgs.filter(m=>m.role==="user"||m.role==="assistant").map(m=>({role:m.role,content:m.content}));
    const text=await callGuide(msgs, C.system);
    const res=detect(C.kind,text);
    C.msgs.push({role:"assistant",content:text,result:res||undefined});
  }catch(e){ C.msgs.push({role:"error",content:e.message}); }
  UI.busy=false; setChat(C); renderChat();
}
function renderChat(){
  if(!C){ $("#chat").hidden=true; return; }
  const last=[...C.msgs].reverse().find(m=>m.result);
  const btn = C.kind==="diag"?"Construire ma montagne": C.kind==="feu"?(S?.zone===2?"Atteindre le sommet":"Passer à la zone suivante"): C.kind==="halte"?"Reprendre la montée":"Enregistrer le bivouac";
  const items=C.msgs.filter(m=>!m.hidden).map(m=>{
    if(m.role==="user") return `<div class="msg me">${esc(m.content)}</div>`;
    if(m.role==="error") return `<div class="note" style="border-color:rgba(229,138,120,.5)"><span class="err">${esc(m.content)}</span><div style="margin-top:8px"><button type="button" class="btn small ghost" data-a="retry">Réessayer</button></div></div>`;
    const v=m.result?visible(m.content):m.content;
    return `${v?`<div class="msg guide">${esc(v)}</div>`:""}${m.result && m===last?`<div class="result"><strong style="font-family:var(--serif);font-weight:500;font-size:18px">${C.kind==="diag"?"Ta montagne est prête":"Le guide a terminé"}</strong><p class="muted" style="font-size:14px">${C.kind==="diag"?`${esc(m.result.massif||"")}, ${m.result.sentiers.length} sentier${m.result.sentiers.length>1?"s":""} pour commencer.`:esc(m.result.bilan||"")}</p><button type="button" class="btn" data-a="applyChat">${btn}</button></div>`:""}`;
  }).join("");
  $("#chat").innerHTML=`<div class="chat-head"><img src="camp-${sceneFor(C.kind)}.jpg" alt=""><div class="t"><h3>${CTITLE[C.kind]}</h3><p class="muted" style="font-size:13px">Ton guide de montagne</p></div><button type="button" class="x" data-a="closeChat" aria-label="Fermer la conversation"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<div class="msgs" id="msgs" aria-live="polite">${items}${UI.busy?`<div class="typing" aria-label="Le guide écrit"><i></i><i></i><i></i></div>`:""}</div>
<div class="composer"><textarea id="cmsg" placeholder="Ta réponse" aria-label="Ta réponse" ${UI.busy?"disabled":""}>${esc(draft)}</textarea><button type="button" class="btn" data-a="sendMsg" aria-label="Envoyer" ${UI.busy?"disabled":""}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>`;
  const m=$("#msgs"); m.scrollTop=m.scrollHeight;
  const ta=$("#cmsg"); ta.addEventListener("input",()=>{ draft=ta.value; ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight,140)+"px"; });
}
function sheetKey(){
  const k=getKey()||{};
  openSheet(head("Ton guide intégré","Avec ta propre clé Claude")+
  `<p>Avec une clé d’API Claude, ton guide parle directement dans l’app : plus de copier-coller, et ta montagne se met à jour toute seule.</p>
  <p class="muted" style="font-size:14px">Crée la clé sur la plateforme développeur de Claude (rubrique API keys). L’usage est facturé par Anthropic selon ta consommation : un diagnostic et quelques feux de camp par mois restent modestes.</p>
  <label for="kk" class="muted" style="font-size:13.5px">Clé d’API</label><input type="password" id="kk" autocomplete="off" placeholder="sk-ant-…" value="${esc(k.key||"")}">
  <label for="km" class="muted" style="font-size:13.5px">Modèle</label><select id="km">${MODELS.map(([v,l])=>`<option value="${v}" ${k.model===v?"selected":""}>${l}</option>`).join("")}</select>
  <p class="safety" style="color:var(--muted);border-color:var(--line)">La clé reste sur ce téléphone et n’est jamais incluse dans tes sauvegardes. Ne l’enregistre que sur ton propre appareil.</p>
  <p class="err" id="kerr" role="alert"></p>
  <div class="row"><button type="button" class="btn" data-a="saveKey">Enregistrer et tester</button>${k.key?`<button type="button" class="btn ghost" data-a="delKey">Retirer la clé</button>`:""}</div>`);
}

/* ---------- actions ---------- */
const getSE=(d)=>{ const s=S.sentiers.find(x=>x.id===d.s); return [s, s?.epreuves.find(x=>x.id===d.e)]; };
function afterValidate(s){
  activateNext(s);
  if(arrived(s)) toast(`${s.nom} est arrivé au camp.`);
  save(); render();
}
const A = {

  chat:d=>startChat(d.k),
  closeChat:()=>closeChat(),
  sendMsg:()=>{ const t=($("#cmsg").value||"").trim(); if(!t||UI.busy) return; C.msgs.push({role:"user",content:t}); draft=""; setChat(C); send(); },
  retry:()=>{ C.msgs=C.msgs.filter(m=>m.role!=="error"); send(); },
  applyChat:()=>{ const m=[...C.msgs].reverse().find(x=>x.result); if(!m) return; const kind=C.kind;
    try{
      if(kind==="diag"){ buildFromDiag(m.result); UI.tab="montagne"; }
      else if(kind==="feu"){ const wz=S.zone; applyFeu(m.result); UI.tab="montagne"; toast(S.sommet?"Sommet atteint. Bravo.":`Bienvenue dans ${ZONES[wz+1]}.`); }
      else if(kind==="bivouac") applyBivouac(m.result);
      else if(kind==="halte") applyHalte(m.result);
      save(); C=null; setChat(null); $("#chat").hidden=true; render(); requestAnimationFrame(scrollToZone);
      if(kind==="diag") toast("Ta montagne est prête. Premier pas en forêt."); else if(kind!=="feu") toast("C’est enregistré.");
    }catch(e){ C.msgs.push({role:"error",content:e.message+" Demande au guide de redonner le bloc final."}); setChat(C); renderChat(); } },
  keySheet:()=>sheetKey(),
  saveKey:async()=>{ const key=$("#kk").value.trim(), model=$("#km").value; if(!key){ $("#kerr").textContent="Colle ta clé d’API."; return; }
    setKey({key,model}); $("#kerr").textContent="";
    const b=document.querySelector('[data-a="saveKey"]'); b.disabled=true; b.textContent="Test en cours…";
    try{ await callGuide([{role:"user",content:"Réponds juste : prêt."}],"Tu es un test de connexion.",20); closeSheet(); render(); toast("Ton guide est branché."); }
    catch(e){ $("#kerr").textContent=e.message; b.disabled=false; b.textContent="Enregistrer et tester"; } },
  delKey:()=>{ setKey(null); closeSheet(); render(); toast("Clé retirée."); },
  tab:d=>{ UI.tab=d.t; render(); $("#view").scrollTop=0; if(d.t==="montagne") requestAnimationFrame(scrollToZone); },
  close:closeSheet,
  copyDiag:async()=>toast(await copy(DIAG)?"Texte du guide copié. Colle-le dans Claude ou Mistral.":"La copie a échoué : sélectionne le texte manuellement."),
  copyPrompt:async()=>toast(await copy(UI.prompt)?"Texte copié. Colle-le dans une nouvelle conversation.":"La copie a échoué."),
  build:()=>{ try{ buildFromDiag(extractJSON($("#paste").value)); save(); UI.tab="montagne"; render(); requestAnimationFrame(scrollToZone); toast("Ta montagne est prête. Premier pas en forêt."); }catch(e){ $("#perr").textContent=e.message; } },
  zone:d=>sheetZone(d.z),
  open:d=>sheetGuide(d.k),
  log:d=>{ const [s,e]=getSE(d); const t=today();
    if(d.v==="x") delete e.log[t]; else e.log[t]=Number(d.v);
    touch(); save();
    if(prog(e).reached){ render(); sheetValidate(s.id,e.id); } else render(); },
  logSeuil:d=>{ const [s,e]=getSE(d); const val=Number($(`#in-${e.id}`).value);
    if(!$(`#in-${e.id}`).value || isNaN(val)){ toast("Entre une mesure en chiffres."); return; }
    const t=today(); e.log[t]=Math.max(val, Number(e.log[t])||-Infinity); touch(); save();
    if(prog(e).reached){ render(); sheetValidate(s.id,e.id); } else { render(); toast(`Noté : ${val} ${e.unite}`); } },
  valider:d=>sheetValidate(d.s,d.e),
  feel:(d,el)=>{ UI.val.note=Number(d.n); document.querySelectorAll(".feel button").forEach(b=>b.setAttribute("aria-pressed", b===el?"true":"false")); },
  confirmVal:()=>{ const {sid,eid,note}=UI.val; if(!note){ $("#verr").textContent="Choisis ton ressenti, de 1 à 5."; return; }
    const s=S.sentiers.find(x=>x.id===sid), e=s.epreuves.find(x=>x.id===eid);
    e.etat="validee"; e.fin=today(); touch();
    S.journal.push({date:today(),type:"validation",sentier:s.nom,epreuve:e.titre,note,texte:$("#vtxt").value.trim()});
    closeSheet(); if(note<=2) toast("Validée. Ton guide en tiendra compte au prochain feu."); else toast("Épreuve validée.");
    afterValidate(s); },
  demain:d=>{ S.demain={date:addDays(today(),1), id:d.e}; save(); render(); toast("C’est décidé pour demain."); },
  fond:d=>{ const s=S.sentiers.find(x=>x.id===d.s); const k=today()+":"+d.i; s.fondLog[k]=!s.fondLog[k]; touch(); save(); render(); },
  applyFeu:()=>{ try{ const wasZ=S.zone; applyFeu(extractJSON($("#gpaste").value)); save(); closeSheet(); UI.tab="montagne"; render(); requestAnimationFrame(scrollToZone); toast(S.sommet?"Sommet atteint. Bravo.":`Bienvenue dans ${ZONES[wasZ+1]}.`); }catch(e){ $("#gerr").textContent=e.message; } },
  applyBivouac:()=>{ try{ applyBivouac(extractJSON($("#gpaste").value)); save(); closeSheet(); render(); toast("Bivouac enregistré."); }catch(e){ $("#gerr").textContent=e.message; } },
  applyHalte:()=>{ try{ applyHalte(extractJSON($("#gpaste").value)); save(); closeSheet(); render(); toast("C’est reparti, pas à pas."); }catch(e){ $("#gerr").textContent=e.message; } },
  skipHalte:()=>{ S.journal.push({date:today(),type:"halte",texte:"Reprise sans faire le point."}); S.halte=null; touch(); save(); closeSheet(); render(); },
  newMassif:()=>{ if(!confirm("Archiver ce massif et en commencer un nouveau ?")) return; const arch=(S.archives||[]).concat([{massif:S.massif.nom,cap:S.massif.cap,fin:today()}]); S={archives:arch}; save(); render(); },
  ics:()=>{ const [h,m]=($("#rt").value||"21:30").split(":"); const d=today().replace(/-/g,"");
    const stamp=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
    const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Ascension//FR","BEGIN:VEVENT",`UID:${uid()}@ascension`,`DTSTAMP:${stamp}`,`DTSTART:${d}T${pad(h)}${pad(m)}00`,"DURATION:PT10M","RRULE:FREQ=DAILY","SUMMARY:Ascension : coche ta journée et choisis l’épreuve de demain","BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY","DESCRIPTION:Ascension","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
    download("rappel-ascension.ics", ics, "text/calendar"); },
  export:()=>download(`ascension-${today()}.json`, JSON.stringify(S,null,1), "application/json"),
  import:()=>{ const i=document.createElement("input"); i.type="file"; i.accept="application/json,.json";
    i.onchange=()=>{ const f=i.files[0]; if(!f) return; f.text().then(t=>{ try{ const j=JSON.parse(t); if(!j.massif) throw 0; S=j; save(); UI.tab="montagne"; render(); toast("Sauvegarde importée."); }catch(e){ toast("Ce fichier n’est pas une sauvegarde Ascension."); } }); };
    i.click(); },
  reset:()=>{ if(!confirm("Tout effacer ? Exporte d’abord une sauvegarde si tu veux garder ton historique.")) return; S=null; try{ localStorage.removeItem(KEY); }catch(e){} mem=null; C=null; setChat(null); UI.tab="montagne"; render(); }
};
document.addEventListener("click", e=>{ const el=e.target.closest("[data-a]"); if(!el) return; const f=A[el.dataset.a]; if(f){ e.preventDefault(); f(el.dataset, el); } });
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && !$("#sheet").hidden) closeSheet(); else if(e.key==="Escape" && !$("#chat").hidden) closeChat();
  if((e.key==="Enter"||e.key===" ") && e.target.matches?.('[role="button"][data-a]')){ e.preventDefault(); A[e.target.dataset.a]?.(e.target.dataset, e.target); }
});

/* ---------- démarrage ---------- */
if(S && S.massif){ checkRules(); }
render();
requestAnimationFrame(scrollToZone);
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
